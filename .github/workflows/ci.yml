name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # 纯标准库、无网络、无容器、无真实数据——约 5 秒跑完全部用例 +
    # design_doc/DESIGN.md TH 表 ↔ config.py 一致性校验（防漂移）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']   # 3.12=开发机；3.10=历史运行版本下限
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 单元测试 + 设计文档一致性校验
        run: ./run_tests.sh
